              <Field label="Who should NOT take this subject"><textarea rows={2} placeholder="Be honest — it helps students avoid wrong choices" style={inputStyle}/></Field>
              <Field label="Career opportunities you've actually seen"><textarea rows={2} placeholder="Real roles, industries, paths you've observed..." style={inputStyle}/></Field>
            </Section>

            <Section title="Reflection">
              <Field label="Would you choose this subject again?">
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  {["Yes", "No", "Unsure"].map(o => (
                    <label key={o} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",borderRadius:100,border:"1.5px solid var(--ink-16)",cursor:"pointer",fontSize:14}}>
                      <input type="radio" name="again" style={{accentColor:"var(--green)"}}/>{o}
                    </label>
                  ))}
                </div>
              </Field>
            </Section>

            <Section title="Consent (required to publish)">
              <p style={{fontSize:13,color:"var(--text-muted)",marginBottom:12,lineHeight:1.5}}>We only need consent to publish your story publicly. Your data also helps train our recommendation model — anonymised and never sold.</p>
              <label style={{display:"flex",gap:10,alignItems:"flex-start",fontSize:14,lineHeight:1.5,marginBottom:10}}>
                <input type="checkbox" required style={{marginTop:4,accentColor:"var(--green)"}}/>
                I consent to this being shown on EduPath BD.
              </label>
              <label style={{display:"flex",gap:10,alignItems:"flex-start",fontSize:14,lineHeight:1.5}}>
                <input type="checkbox" required style={{marginTop:4,accentColor:"var(--green)"}}/>
                I confirm this is my genuine experience.
              </label>
            </Section>

            <div style={{display:"flex",gap:12,justifyContent:"flex-end",marginTop:24}}>
              <button type="button" className="btn btn-ghost" onClick={onClose}>Cancel</button>
              <button type="submit" className="btn btn-primary">Submit story →</button>
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

const inputStyle = {
  width:"100%", padding:"10px 14px",
  border:"1.5px solid var(--ink-16)", borderRadius:"var(--r-input)",
  background:"var(--surface)", color:"var(--text)",
  fontFamily:"inherit", fontSize:14, lineHeight:1.4,
  fontWeight:500, outline:"none", resize:"vertical",
};

function Section({ title, children }) {
  return (
    <div style={{marginBottom:24}}>
      <div style={{fontFamily:"var(--font-body)",fontWeight:700,fontSize:11,letterSpacing:".08em",textTransform:"uppercase",color:"var(--text-muted)",marginBottom:14,paddingBottom:8,borderBottom:"1px solid var(--ink-08)"}}>{title}</div>
      {children}
    </div>
  );
}
function Row({ children }) {
  return <div style={{display:"grid",gridTemplateColumns:`repeat(${React.Children.count(children)}, 1fr)`,gap:12,marginBottom:12}}>{children}</div>;
}
function Field({ label, required, children }) {
  return (
    <label style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
      <span style={{fontSize:12,fontWeight:600,color:"var(--text)"}}>{label}{required ? <span style={{color:"var(--terracotta)"}}> *</span> : null}</span>
      {children}
    </label>
  );
}

Object.assign(window, { ShareModal, Section, Row, Field, inputStyle });

})();
</script>

<script type="text/babel" data-presets="react">
(function(){
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// EduPath BD — App root + simple router

function App() {
  const [section, setSection] = useState("landing"); // landing | explore | detail | stories | matcher | contribute

    if (opts && opts.subjectSlug) setSubjectSlug(opts.subjectSlug);
    setSection(next);
    setAnimKey(k => k + 1);
  };

  let body;
  switch (section) {
    case "explore": body = <ScreenExplore go={go} setSubjectSlug={setSubjectSlug}/>; break;
    case "detail":  body = <ScreenDetail   go={go} subjectSlug={subjectSlug}/>; break;
    case "stories":    body = <ScreenStories    go={go}/>; break;
    case "matcher":    body = <ScreenMatcher    go={go}/>; break;
    case "contribute": body = <ScreenContribute go={go}/>; break;
    default:           body = <ScreenLanding    go={go} setSubjectSlug={setSubjectSlug}/>;
  }

  return (
    <div className="pf-app" data-screen-label={section}>

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

<!-- ═══════════════════════════════════════════════════════════
     LANDING ANIMATIONS
     Three.js 56-point starfield + GSAP ScrollTrigger reveals
     Loaded deferred so all DOM hooks from React are present.
     ═══════════════════════════════════════════════════════════ -->
<script defer>
// EduPath BD — Landing animations + Three.js particle constellation
// Loaded once at page load. Defensive — bails out cleanly if libs missing.

(function () {
  // ── 1. Generic scroll reveals + counters ──
  function initScroll() {
    if (!window.gsap || !window.ScrollTrigger) return;
    gsap.registerPlugin(ScrollTrigger);

    // Fade-up everything tagged
    gsap.utils.toArray("[data-pf-reveal]").forEach(el => {
      gsap.fromTo(el,
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power2.out",
          scrollTrigger: { trigger: el, start: "top 88%", once: true } }
      );
    });

    // Stagger groups
    gsap.utils.toArray("[data-pf-stagger]").forEach(parent => {
      const kids = parent.querySelectorAll("[data-pf-stagger-item]");
      gsap.fromTo(kids,
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out", stagger: 0.05,
          scrollTrigger: { trigger: parent, start: "top 85%", once: true } }
      );
    });

    // Counter animations
    gsap.utils.toArray("[data-pf-counter]").forEach(el => {
      const target = parseInt(el.dataset.target, 10);
      if (isNaN(target)) return;
      const obj = { n: 0 };
      gsap.to(obj, {
        n: target, duration: 1.6, ease: "power2.out",
        onUpdate: () => { el.textContent = Math.round(obj.n); },
        scrollTrigger: { trigger: el, start: "top 88%", once: true },
      });
    });

    // 31-dot grid fill (used anywhere still)
    const dotGrid = document.querySelector("[data-pf-dotgrid]");
    if (dotGrid) {
      const dots = dotGrid.querySelectorAll(".pf-dot");
      gsap.from(dots, {
        scale: 0, opacity: 0,
        duration: 0.5, ease: "back.out(1.6)", stagger: 0.025,
        scrollTrigger: { trigger: dotGrid, start: "top 75%", once: true },
      });
    }
  }

  // ── 2. SplitText mask reveal on the editorial hero headline ──
  function initSplitTextHero() {
    if (!window.gsap) return;
    const lines = document.querySelectorAll("[data-pf-split-line]");
    if (!lines.length) return;
    gsap.set(lines, { yPercent: 100 });
    gsap.to(lines, {
      yPercent: 0,
      duration: 1.1,
      ease: "expo.out",
      stagger: 0.12,
      delay: 0.15,
    });
  }

  // ── 3. Pinned "brutal reality" — stats appear sequentially, bg fades to green ──
  function initPinnedReality() {
    if (!window.gsap || !window.ScrollTrigger) return;
    const section = document.querySelector("[data-pf-reality]");
    if (!section) return;
    const pin = section.querySelector(".pf-reality__pin");
    const bg = section.querySelector("[data-pf-reality-bg]");
    const stats = section.querySelectorAll("[data-pf-reality-stat]");
    const rule = section.querySelector("[data-pf-reality-rule]");
    if (!pin || !stats.length) return;

    // Set initial state — only the eyebrow visible
    gsap.set(stats, { opacity: 0, y: 60 });
    gsap.set(rule, { opacity: 0, y: 30 });

    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: section,
        start: "top top",
        end: "bottom bottom",
        scrub: 0.8,
      },
    });

    // 0 — 0.15: background fades cream → green
    tl.to(bg, { backgroundColor: "#004D38", duration: 0.15, ease: "power1.inOut" }, 0);
    tl.call(() => pin.setAttribute("data-bg", "green"), null, 0.15);

    // 0.15 — 0.35: first stat
    tl.to(stats[0], { opacity: 1, y: 0, duration: 0.2 }, 0.15);

    // 0.35 — 0.55: stat 1 fades, stat 2 appears
    tl.to(stats[0], { opacity: 0, y: -40, duration: 0.15 }, 0.35);
    tl.to(stats[1], { opacity: 1, y: 0, duration: 0.2 }, 0.40);

    // 0.55 — 0.75: stat 2 fades, stat 3 appears
    tl.to(stats[1], { opacity: 0, y: -40, duration: 0.15 }, 0.60);
    tl.to(stats[2], { opacity: 1, y: 0, duration: 0.2 }, 0.65);

    // 0.85 — 1.0: stat 3 fades, the rule appears
    tl.to(stats[2], { opacity: 0, y: -40, duration: 0.15 }, 0.82);
    tl.to(rule,     { opacity: 1, y: 0,   duration: 0.18 }, 0.86);

    // Listen for the data-bg attribute to flip back if user scrolls past
    ScrollTrigger.create({
      trigger: section,
      start: "bottom 80%",
      onEnterBack: () => pin.setAttribute("data-bg", "green"),
      onLeave:     () => pin.setAttribute("data-bg", "green"),
    });
    ScrollTrigger.create({
      trigger: section,
      start: "top 80%",
      onLeaveBack: () => pin.removeAttribute("data-bg"),
    });
  }

  // ── 4. Horizontal scroll for featured subjects ──
  function initHorizontalScroll() {
    if (!window.gsap || !window.ScrollTrigger) return;
    const section = document.querySelector("[data-pf-hscroll]");
    if (!section) return;
    const track = section.querySelector("[data-pf-hscroll-track]");
    if (!track) return;
    if (window.innerWidth < 980) return; // mobile uses native overflow-x scroll

    const distance = () => track.scrollWidth - window.innerWidth + 48;
    gsap.to(track, {
      x: () => -distance(),
      ease: "none",
      scrollTrigger: {
        trigger: section,
        start: "top top",
        end: () => "+=" + distance(),
        scrub: 0.6,
        invalidateOnRefresh: true,
      },
    });

    // Hide the scroll hint after the user has scrolled into it
    const hint = section.querySelector("[data-pf-hscroll-hint]");
    if (hint) {
      gsap.to(hint, {
        opacity: 0, duration: 0.5,
        scrollTrigger: { trigger: section, start: "top 20%", once: true },
      });
    }
  }

  // ── 5. Masonry voices — parallax offset per cell ──
  function initParallaxMasonry() {
    if (!window.gsap || !window.ScrollTrigger) return;
    gsap.utils.toArray("[data-pf-parallax]").forEach(el => {
      const offset = parseFloat(el.dataset.pfParallax) || 0;
      if (!offset) return;
      gsap.fromTo(el,
        { y: offset },
        { y: -offset,
          ease: "none",
          scrollTrigger: { trigger: el, start: "top bottom", end: "bottom top", scrub: 0.8 },
        }
      );
    });
  }

  // ── 6. Three.js particle constellation behind the hero ──
  function initStarfield() {
    if (!window.THREE) return;
    const host = document.querySelector("[data-pf-starfield]");
    if (!host) return;

    const w = host.clientWidth, h = host.clientHeight;
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 1000);
    camera.position.z = 14;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(w, h);
    renderer.setClearColor(0x000000, 0);
    host.appendChild(renderer.domElement);

    // 56 points — one per real respondent. 3 highlighted (gold).
    const N = 56;
    const HIGHLIGHTED = new Set([3, 27, 41]);
    const positions = new Float32Array(N * 3);
    const colors    = new Float32Array(N * 3);
    const sizes     = new Float32Array(N);

    const dim = new THREE.Color(0x006A4E);
    const lit = new THREE.Color(0xF4A823);

    for (let i = 0; i < N; i++) {
      positions[i*3 + 0] = (Math.random() - 0.5) * 22;
      positions[i*3 + 1] = (Math.random() - 0.5) * 14;
      positions[i*3 + 2] = -Math.random() * 14 - 2;
      const c = HIGHLIGHTED.has(i) ? lit : dim;
      colors[i*3 + 0] = c.r;
      colors[i*3 + 1] = c.g;
      colors[i*3 + 2] = c.b;
      sizes[i] = HIGHLIGHTED.has(i) ? 0.36 : 0.10;
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute("color",    new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute("size",     new THREE.BufferAttribute(sizes, 1));

    // Circular sprite via canvas
    const tex = (function () {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const g = c.getContext("2d");
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 30);
      grad.addColorStop(0,   "rgba(255,255,255,1)");
      grad.addColorStop(0.4, "rgba(255,255,255,0.6)");
      grad.addColorStop(1,   "rgba(255,255,255,0)");
      g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
      const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
    })();

    const pointsMat = new THREE.ShaderMaterial({
      uniforms: { uTex: { value: tex }, uTime: { value: 0 } },
      vertexShader: `
        attribute float size;
        varying vec3 vColor;
        uniform float uTime;
        void main() {
          vColor = color;
          vec3 p = position;
          p.x += sin(uTime * 0.30 + position.y * 0.6) * 0.10;
          p.y += cos(uTime * 0.25 + position.x * 0.4) * 0.10;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          gl_PointSize = size * 260.0 / -mv.z;
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec3 vColor;
        void main() {
          vec4 t = texture2D(uTex, gl_PointCoord);
          if (t.a < 0.02) discard;
          gl_FragColor = vec4(vColor, t.a);
        }
      `,
      transparent: true, depthWrite: false, vertexColors: true,
    });
    const points = new THREE.Points(geometry, pointsMat);
    scene.add(points);

    // ── Connecting lines between nearby points ──
    // Build once with fixed pairs (perf-friendly), then sway with the same drift.
    const pairs = [];
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const dx = positions[i*3] - positions[j*3];
        const dy = positions[i*3+1] - positions[j*3+1];
        const dz = positions[i*3+2] - positions[j*3+2];
        const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
        if (d < 4.5) pairs.push([i, j, d]);
      }
    }
    const linePositions = new Float32Array(pairs.length * 2 * 3);
    const lineAlphas    = new Float32Array(pairs.length * 2);
    pairs.forEach(([i, j, d], idx) => {
      // Closer pairs = brighter line
      const a = Math.max(0.05, 0.45 - (d / 6));
      lineAlphas[idx*2]     = a;
      lineAlphas[idx*2 + 1] = a;
    });
    const lineGeom = new THREE.BufferGeometry();
    lineGeom.setAttribute("position", new THREE.BufferAttribute(linePositions, 3));
    lineGeom.setAttribute("alpha",    new THREE.BufferAttribute(lineAlphas, 1));
    const lineMat = new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color(0x006A4E) } },
      vertexShader: `
        attribute float alpha;
        varying float vAlpha;
        void main() {
          vAlpha = alpha;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vAlpha;
        void main() { gl_FragColor = vec4(uColor, vAlpha); }
      `,
      transparent: true, depthWrite: false,
    });
    const lines = new THREE.LineSegments(lineGeom, lineMat);
    scene.add(lines);

    // Animation loop
    let frame = 0, running = true;
    const start = performance.now();
    const baseLine = new Float32Array(linePositions.length);

    function tick() {
      if (!running) return;
      const t = (performance.now() - start) / 1000;
      pointsMat.uniforms.uTime.value = t;

      // Update line positions from current drifted point positions
      const posAttr = geometry.attributes.position;
      const drift = (i, axis) => {
        if (axis === 0) return Math.sin(t * 0.30 + positions[i*3+1] * 0.6) * 0.10;
        if (axis === 1) return Math.cos(t * 0.25 + positions[i*3]   * 0.4) * 0.10;
        return 0;
      };
      for (let k = 0; k < pairs.length; k++) {
        const [i, j] = pairs[k];
        linePositions[k*6 + 0] = positions[i*3+0] + drift(i, 0);
        linePositions[k*6 + 1] = positions[i*3+1] + drift(i, 1);
        linePositions[k*6 + 2] = positions[i*3+2];
        linePositions[k*6 + 3] = positions[j*3+0] + drift(j, 0);
        linePositions[k*6 + 4] = positions[j*3+1] + drift(j, 1);
        linePositions[k*6 + 5] = positions[j*3+2];
      }
      lineGeom.attributes.position.needsUpdate = true;

      points.rotation.y = Math.sin(t * 0.08) * 0.10;
      points.rotation.x = Math.cos(t * 0.06) * 0.05;
      lines.rotation.copy(points.rotation);

      renderer.render(scene, camera);
      frame = requestAnimationFrame(tick);
    }
    tick();

    const obs = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !running) { running = true; tick(); }
      else if (!entry.isIntersecting) { running = false; cancelAnimationFrame(frame); }
    }, { threshold: 0 });
    obs.observe(host);

    window.addEventListener("resize", () => {
      const W = host.clientWidth, H = host.clientHeight;
      renderer.setSize(W, H);
      camera.aspect = W / H;
      camera.updateProjectionMatrix();
    });
  }

  // ── Boot ──
  function boot() {
    // Clear any prior ScrollTriggers (when re-entering landing)
    if (window.ScrollTrigger) ScrollTrigger.getAll().forEach(t => t.kill());
    initSplitTextHero();
    initStarfield();
    initScroll();
    initPinnedReality();
    initHorizontalScroll();
    initParallaxMasonry();
    if (window.ScrollTrigger) ScrollTrigger.refresh();
  }
  setTimeout(boot, 80);
  window.__pfReanimate = () => setTimeout(boot, 80);
})();

</script>
