<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=1280, initial-scale=1"/>
  <title>EduPath BD — Find the degree you were made for.</title>

  <!-- Fonts via Google Fonts (Fraunces + Plus Jakarta Sans variable) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

  <style>
/* ============================================================
   EduPath BD — Design Tokens
   colors_and_type.css
   ============================================================ */

/* Fonts — self-hosted variable TTFs.
   Fraunces is loaded with its full opsz (9–144) + wght (100–900) axes,
   so font-optical-sizing: auto picks the right cut at every scale and
   the gold-italic accent word in headlines uses the true italic. */





:root {
  /* ---------- COLOR (8 brand tokens + 2 derived overlays) ---------- */
  --bg:           #F5EFE4;
  --surface:      #FFFFFF;
  --surface-alt:  #EDE8DF;
  --green:        #006A4E;
  --green-dark:   #004D38;
  --gold:         #F4A823;
  --terracotta:   #C8553D;
  --text:         #1A1714;
  --text-muted:   #7A6E65;

  --green-12:     color-mix(in oklab, #006A4E 12%, transparent);
  --green-24:     color-mix(in oklab, #006A4E 24%, transparent);
  --ink-08:       color-mix(in oklab, #1A1714 8%, transparent);
  --ink-16:       color-mix(in oklab, #1A1714 16%, transparent);
  --gold-16:      color-mix(in oklab, #F4A823 16%, transparent);
  --terracotta-16:color-mix(in oklab, #C8553D 16%, transparent);

  /* Field accent colors (subject categories) */
  --field-technology:      #2A6FDB;
  --field-business:        #B07A1F;
  --field-science:         #5C8C3E;
  --field-social-science:  #8E5BB7;
  --field-humanities:      #C8553D;
  --field-environmental:   #2F8F6A;
  --field-design:          #D97757;
  --field-applied:         #4F5D75;

  /* ---------- TYPOGRAPHY ---------- */
  --font-display: "Fraunces", ui-serif, Georgia, serif;
  --font-body:    "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  /* Type scale tokens */
  --display-1-size:   72px;  --display-1-line:   76px;
  --display-2-size:   56px;  --display-2-line:   60px;
  --h1-size:          40px;  --h1-line:          48px;
  --h2-size:          32px;  --h2-line:          40px;
  --h3-size:          24px;  --h3-line:          32px;
  --lead-size:        20px;  --lead-line:        30px;
  --body-size:        16px;  --body-line:        26px;
  --small-size:       14px;  --small-line:       22px;
  --micro-size:       12px;  --micro-line:       16px;
  --quote-size:       28px;  --quote-line:       40px;

  /* ---------- SPACING (4px grid) ---------- */
  --s-1:   4px;
  --s-2:   8px;
  --s-3:  12px;
  --s-4:  16px;
  --s-5:  20px;
  --s-6:  24px;
  --s-7:  32px;
  --s-8:  40px;
  --s-9:  48px;
  --s-10: 64px;
  --s-11: 96px;
  --s-12: 128px;

  /* ---------- RADIUS ---------- */
  --r-card:  16px;
  --r-modal: 24px;
  --r-pill:  100px;
  --r-input: 12px;
  --r-image: 12px;

  /* ---------- SHADOWS ---------- */
  --shadow-1: 0 1px 2px rgba(26,23,20,0.06), 0 4px 12px rgba(26,23,20,0.04);
  --shadow-2: 0 4px 8px rgba(26,23,20,0.08), 0 12px 28px rgba(26,23,20,0.08);
  --shadow-3: 0 24px 64px rgba(26,23,20,0.18), 0 8px 16px rgba(26,23,20,0.08);

  /* ---------- MOTION ---------- */
  --ease-editorial: cubic-bezier(0.2, 0.8, 0.2, 1);
  --t-fast: 120ms;
  --t-mid:  240ms;
  --t-slow: 400ms;

  /* ---------- LAYOUT ---------- */
  --container-marketing: 1200px;
  --container-product:    960px;
  --container-matcher:    720px;
  --nav-h:                72px;
  --sticky-filter-h:      64px;
}

/* ============================================================
   Base resets + global type
   ============================================================ */

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: var(--body-size);
  line-height: var(--body-line);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

::selection { background: var(--gold); color: var(--text); }

/* ============================================================
   Semantic type classes
   ============================================================ */

.display-1, h1.display-1 {
  font-family: var(--font-display);
  font-size: var(--display-1-size);
  line-height: var(--display-1-line);
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: pretty;
  margin: 0;
}
.display-2 {
  font-family: var(--font-display);
  font-size: var(--display-2-size);
  line-height: var(--display-2-line);
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: pretty;
  margin: 0;
}
h1, .h1 {
  font-family: var(--font-display);
  font-size: var(--h1-size);
  line-height: var(--h1-line);
  font-weight: 600;
  letter-spacing: -0.015em;
  text-wrap: pretty;
  margin: 0;
}
h2, .h2 {
  font-family: var(--font-display);
  font-size: var(--h2-size);
  line-height: var(--h2-line);
  font-weight: 600;
  letter-spacing: -0.01em;
  text-wrap: pretty;
  margin: 0;
}
h3, .h3 {
  font-family: var(--font-display);
  font-size: var(--h3-size);
  line-height: var(--h3-line);
  font-weight: 600;
  text-wrap: pretty;
  margin: 0;
}
.lead {
  font-size: var(--lead-size);
  line-height: var(--lead-line);
  color: var(--text-muted);
}
p, .body { font-size: var(--body-size); line-height: var(--body-line); margin: 0; }
.small  { font-size: var(--small-size); line-height: var(--small-line); font-weight: 500; }
.micro  {
  font-size: var(--micro-size);
  line-height: var(--micro-line);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
}
.quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: var(--quote-size);
  line-height: var(--quote-line);
  font-weight: 400;
  color: var(--text);
  text-wrap: pretty;
}

/* Gold-italic accent word inside a headline */
.gold-em {
  font-style: italic;
  color: var(--gold);
  /* Optical bump — italic Fraunces benefits from a touch more weight */
  font-weight: 500;
}

/* ============================================================
   Buttons
   ============================================================ */

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: 14px 24px;
  border-radius: var(--r-pill);
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 600;
  line-height: 1;
  border: none;
  cursor: pointer;
  text-decoration: none;
  transition: background var(--t-fast) ease, color var(--t-fast) ease, transform var(--t-fast) ease, box-shadow var(--t-fast) ease;
  white-space: nowrap;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--green); color: #fff; }
.btn-primary:hover { background: var(--green-dark); }
.btn-ghost { background: transparent; color: var(--green); box-shadow: inset 0 0 0 1.5px var(--green); }
.btn-ghost:hover { background: var(--green-12); }
.btn-gold { background: var(--gold); color: var(--text); }
.btn-gold:hover { background: #DC9614; }
.btn-on-green { background: var(--gold); color: var(--text); }

/* ============================================================
   Pills / Chips
   ============================================================ */

.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
  padding: 6px 12px;
  border-radius: var(--r-pill);
  background: transparent;
  color: var(--text);
  font-size: var(--small-size);
  font-weight: 500;
  line-height: 1;
  box-shadow: inset 0 0 0 1px var(--ink-16);
  cursor: pointer;
  transition: background var(--t-fast) ease, color var(--t-fast) ease, box-shadow var(--t-fast) ease;
}
.pill.is-active {
  background: var(--green);
  color: #fff;
  box-shadow: none;
}
.pill-gold {
  background: var(--gold-16);
  color: var(--text);
  box-shadow: none;
}

/* ============================================================
   Card
   ============================================================ */

.card {
  background: var(--surface);
  border-radius: var(--r-card);
  box-shadow: var(--shadow-1);
  transition: transform var(--t-mid) var(--ease-editorial), box-shadow var(--t-mid) var(--ease-editorial);
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }

/* Honesty box — terracotta-bordered callout */
.honesty {
  border-left: 4px solid var(--terracotta);
  background: var(--terracotta-16);
  border-radius: var(--r-input);
  padding: var(--s-4) var(--s-5);
  color: var(--text);
}

/* Focus ring */
:where(button, a, input, [tabindex]):focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
  border-radius: 4px;
}

/* ============================================================
   EduPath BD UI Kit — layout + component styles
   ============================================================ */

/* ---------- App scaffold ---------- */
.pf-app { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
.pf-main { flex: 1; padding-top: var(--nav-h); }
.pf-container { max-width: var(--container-marketing); margin: 0 auto; padding: 0 24px; }
.pf-container--narrow { max-width: var(--container-product); margin: 0 auto; padding: 0 24px; }

/* ---------- Nav ---------- */
.pf-nav {
  position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
  z-index: 50;
  background: transparent;
  transition: background var(--t-fast) ease, box-shadow var(--t-fast) ease, backdrop-filter var(--t-fast) ease;
}
.pf-nav.is-scrolled {
  background: color-mix(in oklab, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  box-shadow: 0 1px 0 var(--ink-08), 0 4px 24px rgba(26,23,20,0.04);
}
.pf-nav__inner {
  max-width: var(--container-marketing); margin: 0 auto;
  padding: 0 24px; height: 100%;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.pf-logo { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.pf-logo svg { display: block; }
.pf-logo__text {
  font-family: var(--font-display); font-size: 22px; font-weight: 600;
  letter-spacing: -0.01em; color: var(--text); line-height: 1;
}
.pf-logo__text em { font-style: normal; color: var(--green); }
.pf-nav__links { display: flex; align-items: center; gap: 28px; }
.pf-nav__link {
  position: relative; padding: 8px 0; cursor: pointer;
  font-size: 15px; font-weight: 500; color: var(--text);
  background: none; border: none; font-family: inherit;
}
.pf-nav__link::after {
  content: ""; position: absolute; bottom: -2px; left: 50%;
  transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%;
  background: var(--green); opacity: 0; transition: opacity var(--t-fast) ease;
}
.pf-nav__link:hover::after { opacity: 0.4; }
.pf-nav__link.is-active::after { opacity: 1; }
.pf-nav__cta { margin-left: 8px; }

/* ---------- Hero ---------- */
.pf-hero { padding: 80px 0 64px; }
.pf-hero__grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 64px; align-items: center; }
.pf-hero__eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--gold-16); color: var(--text);
  padding: 6px 14px; border-radius: 100px;
  font-size: 13px; font-weight: 500; margin-bottom: 24px;
}
.pf-hero__title { margin-bottom: 24px; }
.pf-hero__title .display-1 { font-size: 64px; line-height: 68px; }
.pf-hero__sub { font-size: 18px; line-height: 28px; color: var(--text-muted); margin-bottom: 32px; max-width: 540px; }
.pf-hero__ctas { display: flex; gap: 12px; margin-bottom: 24px; }
.pf-hero__trust { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
.pf-hero__trust span { display: inline-flex; align-items: center; gap: 6px; }

/* Hero composition (overlapping testimonial cards) */
.pf-hero__viz { position: relative; height: 480px; }
.pf-hero__card {
  position: absolute; width: 340px;
  background: var(--surface); border-radius: 20px;
  box-shadow: var(--shadow-2);
  padding: 22px 22px 20px;
  transition: transform 600ms var(--ease-editorial), opacity 600ms var(--ease-editorial), filter 600ms var(--ease-editorial);
}
.pf-hero__card--back  { top: 24px;  left: 30px;  transform: rotate(-6deg); opacity: 0.55; filter: blur(0.5px); }
.pf-hero__card--mid   { top: 72px;  left: 90px;  transform: rotate(3deg);  opacity: 0.85; }
.pf-hero__card--front { top: 130px; left: 50px;  transform: rotate(0);     opacity: 1; }

/* ---------- Stats strip ---------- */
.pf-stats {
  background: var(--green-dark); color: #fff;
  padding: 36px 0;
}
.pf-stats__grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
  max-width: var(--container-marketing); margin: 0 auto; padding: 0 24px;
}
.pf-stats__num {
  font-family: var(--font-display); font-weight: 600;
  font-size: 56px; line-height: 1; letter-spacing: -0.02em;
}
.pf-stats__num em { color: var(--gold); font-style: normal; }
.pf-stats__lbl {
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  font-weight: 600; opacity: 0.78; margin-top: 8px;
}

/* ---------- Did you know recess ---------- */
.pf-recess { background: var(--surface-alt); padding: 96px 0; }
.pf-recess__inner { max-width: 880px; margin: 0 auto; padding: 0 24px; text-align: center; }
.pf-recess .quote { font-size: 36px; line-height: 1.25; }
.pf-recess__sub { margin-top: 20px; font-size: 16px; color: var(--text-muted); }

/* ---------- 3 colored feature cards (Edukids-style) ---------- */
.pf-features { padding: 96px 0; }
.pf-features__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.pf-feature {
  border-radius: 20px; padding: 28px 24px 24px; min-height: 240px;
  display: flex; flex-direction: column; gap: 14px;
  transition: transform var(--t-mid) var(--ease-editorial), box-shadow var(--t-mid) var(--ease-editorial);
  box-shadow: var(--shadow-1);
}
.pf-feature:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }
.pf-feature__icon { font-size: 28px; }
.pf-feature h3 { color: inherit; font-size: 22px; line-height: 1.2; }
.pf-feature p { font-size: 14px; line-height: 1.5; opacity: 0.92; }
.pf-feature--green { background: var(--green); color: #fff; }
.pf-feature--gold { background: var(--gold); color: var(--text); }
.pf-feature--terra { background: var(--terracotta); color: #fff; }

/* ---------- How it works ---------- */
.pf-how { padding: 32px 0 96px; }
.pf-how__head { margin-bottom: 48px; }
.pf-how__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.pf-how__step { display: flex; flex-direction: column; gap: 12px; }
.pf-how__num {
  font-family: var(--font-display); font-weight: 600;
  font-size: 88px; line-height: 1; color: transparent;
  -webkit-text-stroke: 1.5px var(--green);
  letter-spacing: -0.04em;
}

/* ---------- CTA strip ---------- */
.pf-cta-strip {
  background: var(--green); color: #fff;
  padding: 56px 0;
  text-align: center;
}
.pf-cta-strip h2 { font-family: var(--font-display); font-weight: 600; font-size: 36px; line-height: 1.2; margin-bottom: 24px; color: #fff;}

/* ---------- Footer ---------- */
.pf-footer { background: var(--green-dark); color: rgba(255,255,255,0.82); padding: 64px 0 32px; }
.pf-footer__grid {
  display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 48px;
  max-width: var(--container-marketing); margin: 0 auto; padding: 0 24px;
}
.pf-footer__brand { display: flex; flex-direction: column; gap: 14px; }
.pf-footer__brand p { font-size: 14px; line-height: 1.5; max-width: 320px; }
.pf-footer h4 { color: #fff; font-family: var(--font-body); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
.pf-footer__links { display: flex; flex-direction: column; gap: 8px; }
.pf-footer__links a { color: rgba(255,255,255,0.82); text-decoration: none; font-size: 14px; cursor: pointer; transition: color var(--t-fast); background:none; border:none; padding:0; text-align:left; font-family:inherit;}
.pf-footer__links a:hover { color: var(--gold); }
.pf-footer__legal { border-top: 1px solid rgba(255,255,255,0.12); margin: 48px 24px 0; padding-top: 24px; font-size: 12px; opacity: 0.7; max-width: var(--container-marketing); margin-left: auto; margin-right: auto;}

/* ---------- Sticky filter bar ---------- */
.pf-stickybar {
  position: sticky; top: var(--nav-h); z-index: 30;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--ink-08);
}
.pf-stickybar__inner {
  max-width: var(--container-marketing); margin: 0 auto;
  padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.pf-stickybar__inner .micro { margin: 0; flex-shrink: 0; }

/* ---------- Subject card ---------- */
.pf-scard {
  background: var(--surface); border-radius: var(--r-card);
  box-shadow: var(--shadow-1); overflow: hidden;
  display: flex; flex-direction: column; cursor: pointer;
  transition: transform var(--t-mid) var(--ease-editorial), box-shadow var(--t-mid) var(--ease-editorial);
  position: relative;
}
.pf-scard:hover { transform: translateY(-4px); box-shadow: var(--shadow-2); }
.pf-scard:hover .pf-scard__arr { transform: translateX(4px); }
.pf-scard__top { height: 4px; }
.pf-scard__body { padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.pf-scard__meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pf-scard__name { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.15; letter-spacing: -0.01em; }
.pf-scard__desc { font-size: 14px; color: var(--text-muted); line-height: 1.45; }
.pf-scard__hsc { display: flex; gap: 6px; flex-wrap: wrap; }
.pf-scard__dots { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-muted); }
.pf-scard__dots .d { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); opacity: 0.25; }
.pf-scard__dots .d.on { background: var(--green); opacity: 1; }
.pf-scard__foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--ink-08); padding-top: 12px; margin-top: 4px; }
.pf-scard__sal { font-weight: 600; font-size: 14px; }
.pf-scard__arr { color: var(--green); font-weight: 700; font-size: 18px; transition: transform var(--t-mid) var(--ease-editorial); }

.pf-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.pf-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

/* ---------- Testimonial card ---------- */
.pf-tcard {
  background: var(--surface); border-radius: var(--r-card);
  box-shadow: var(--shadow-1); padding: 22px;
  display: flex; flex-direction: column; gap: 14px;
  transition: max-height var(--t-slow) var(--ease-editorial);
}
.pf-tcard__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; }
.pf-tcard__who { display: flex; gap: 12px; align-items: center; }
.pf-tcard__name { font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.2; }
.pf-tcard__sub { font-size: 12px; color: var(--text-muted); }
.pf-tcard__role { font-weight: 700; color: var(--green); font-size: 14px; }
.pf-tcard__mark { font-family: var(--font-display); font-size: 48px; line-height: 0; color: var(--gold); height: 18px; margin-bottom: -4px; }
.pf-tcard__quote { font-family: var(--font-display); font-size: 18px; line-height: 1.45; letter-spacing: -0.005em; }
.pf-tcard__foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--ink-08); padding-top: 12px; }
.pf-tcard__expand { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; border-top: 1px solid var(--ink-08); }
.pf-tcard__expand h5 { font-family: var(--font-body); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0; }
.pf-tcard__expand p { font-size: 13.5px; line-height: 1.5; margin: 0; }

/* Avatar */
.pf-av {
  width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: var(--font-display); font-weight: 600; font-size: 18px;
  flex-shrink: 0;
}
.pf-av--lg { width: 64px; height: 64px; font-size: 24px; }

/* ---------- Chips (ok / sw) ---------- */
.pill-ok { background: #E2F1EA; color: #0A5E44; box-shadow: none; font-weight: 500; }
.pill-sw { background: var(--terracotta-16); color: #7C2A18; box-shadow: none; font-weight: 500; }
.pill-note { background: #FBEFD0; color: #7A5400; box-shadow: none; font-weight: 500; }

/* ---------- Detail page ---------- */
.pf-detail-head {
  background: var(--green-dark); color: #fff; padding: 40px 0 48px;
}
.pf-detail-head__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; font-size: 14px; }
.pf-detail-head__top a { color: rgba(255,255,255,0.85); text-decoration: none; cursor: pointer; }
.pf-detail-head__pills { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.pf-detail-head__pills .pill { color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.3); }
.pf-detail-head__pills .pill-gold { background: var(--gold); color: var(--text); box-shadow: none; }
.pf-detail-head .display-2 { color: #fff; }
.pf-detail-head__desc { font-size: 18px; line-height: 1.5; color: rgba(255,255,255,0.82); max-width: 720px; margin-top: 12px; }
.pf-detail-head__facts { display: flex; gap: 18px; margin-top: 24px; flex-wrap: wrap; font-size: 14px; color: rgba(255,255,255,0.85); }
.pf-detail-section { padding: 56px 0; border-bottom: 1px solid var(--ink-08); }
.pf-detail-section h2 { margin-bottom: 24px; }

/* Curriculum timeline */
.pf-timeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; position: relative; }
.pf-timeline::before { content:""; position: absolute; top: 22px; left: 0; right: 0; height: 2px; background: var(--green); opacity: 0.2; z-index:0;}
.pf-tphase { background: var(--surface); border-radius: 14px; padding: 18px 18px 20px; box-shadow: var(--shadow-1); position: relative; }
.pf-tphase__year { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pf-tphase__dot { width: 14px; height: 14px; border-radius: 50%; background: var(--green); flex-shrink: 0; position: relative; z-index: 1; box-shadow: 0 0 0 4px var(--bg); }
.pf-tphase__yr-label { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.pf-tphase h4 { font-family: var(--font-display); font-weight: 600; font-size: 16px; margin: 0 0 10px; }
.pf-tphase ul { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.4; color: var(--text); }
.pf-tphase li::before { content: "•  "; color: var(--green); }
.pf-tphase__note {
  font-size: 12px; color: var(--terracotta);
  background: var(--terracotta-16); padding: 8px 10px; border-radius: 8px; line-height: 1.4;
  border-left: 3px solid var(--terracotta);
}
.pf-tphase__note.good { color: #0A5E44; background: #E2F1EA; border-left-color: #0A5E44; }

/* Vertical 2-phase timeline (used for thin-data subjects) */
.pf-vtimeline { display: flex; flex-direction: column; gap: 0; max-width: 760px; }
.pf-vphase { display: grid; grid-template-columns: 40px 1fr; gap: 18px; align-items: stretch; }
.pf-vphase__rail { position: relative; display: flex; justify-content: center; padding-top: 22px; }
.pf-vphase__rail::after {
  content:""; position: absolute; top: 8px; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 2px; background: linear-gradient(to bottom, var(--green) 0%, var(--gold) 100%); opacity: 0.5;
}
.pf-vphase:last-child .pf-vphase__rail::after { bottom: 24px; }
.pf-vphase__dot {
  position: relative; z-index: 1; width: 14px; height: 14px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 0 0 3px var(--green), 0 0 0 6px var(--bg);
}
.pf-vphase__body { background: var(--surface); border-radius: 14px; padding: 22px 24px; box-shadow: var(--shadow-1); margin-bottom: 16px; }
.pf-vphase__year { font-family: var(--font-body); font-weight: 700; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
.pf-vphase__body h4 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.2; margin: 0 0 14px; letter-spacing: -0.01em; }
.pf-vphase__body ul { list-style: none; padding: 0; margin: 0 0 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; }
.pf-vphase__body li::before { content: "•  "; color: var(--green); }

/* Verified-source badge on testimonial cards */
.pf-verified {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px 3px 7px; border-radius: 100px;
  background: color-mix(in oklab, var(--green) 10%, transparent);
  color: var(--green); font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.04em; text-transform: uppercase; line-height: 1;
}
.pf-verified::before { content:""; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* Career columns */
.pf-careers { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.pf-career-col { background: var(--surface); border-radius: 14px; padding: 22px 24px; box-shadow: var(--shadow-1); }
.pf-career-col h3 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin-bottom: 14px; display:flex;align-items:center;gap:8px;}
.pf-career-col ul { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.pf-career-col ul li::before { content: "·  "; color: var(--green); }
.pf-career-col .sal { font-weight: 600; font-size: 16px; margin-bottom: 6px; }
.pf-career-col .src { font-size: 12px; color: var(--text-muted); }

/* University pills */
.pf-unis { display: flex; flex-direction: column; gap: 14px; }
.pf-unis__row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pf-unis__lbl { width: 180px; flex-shrink: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
.pf-unis__pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--surface); border-radius: 100px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-1); cursor: pointer; }
.pf-unis__pill:hover { box-shadow: var(--shadow-2); }

/* ---------- Matcher card ---------- */
.pf-matcher { padding: 64px 0 96px; }
.pf-matcher__card {
  max-width: var(--container-matcher); margin: 0 auto;
  background: var(--surface); border-radius: var(--r-modal);
  box-shadow: var(--shadow-3); padding: 40px 44px 36px;
}
.pf-matcher__progress { margin-bottom: 28px; }
.pf-matcher__progress .micro { display: flex; justify-content: space-between; margin-bottom: 10px; }
.pf-matcher__progress .micro .right { color: var(--text-muted); }
.pf-matcher__track { height: 6px; background: var(--ink-08); border-radius: 100px; overflow: hidden; }
.pf-matcher__fill { height: 100%; background: var(--green); border-radius: 100px; transition: width var(--t-slow) var(--ease-editorial); }
.pf-matcher__fill.l2 { background: linear-gradient(90deg, var(--green) 0%, var(--green) 50%, var(--gold) 100%); }
.pf-matcher__layer { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--green); margin-bottom: 10px; }
.pf-matcher__layer.l2 { color: var(--gold); }
.pf-matcher__q { font-family: var(--font-display); font-weight: 600; font-size: 32px; line-height: 1.2; margin-bottom: 8px; }
.pf-matcher__sub { color: var(--text-muted); margin-bottom: 24px; }
.pf-matcher__chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 28px; }
.pf-matcher__chip {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border-radius: 14px; background: var(--surface);
  box-shadow: inset 0 0 0 1.5px var(--ink-08);
  cursor: pointer; text-align: left; font-family: inherit;
  transition: box-shadow var(--t-fast), background var(--t-fast);
  border: none;
}
.pf-matcher__chip:hover { box-shadow: inset 0 0 0 1.5px var(--green); }
.pf-matcher__chip.is-active { box-shadow: inset 0 0 0 2px var(--green); background: var(--green-12); }
.pf-matcher__chip .emo { font-size: 22px; line-height: 1; flex-shrink: 0; }
.pf-matcher__chip .label { font-weight: 600; font-size: 14px; line-height: 1.2; margin-bottom: 4px; }
.pf-matcher__chip .desc { font-size: 12px; color: var(--text-muted); line-height: 1.3; }
.pf-matcher__cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 28px; }
.pf-matcher__option {
  padding: 20px; border-radius: 16px; background: var(--surface);
  box-shadow: inset 0 0 0 1.5px var(--ink-08); cursor: pointer; text-align: left;
  font-family: inherit; border:none; transition: box-shadow var(--t-fast), background var(--t-fast);
}
.pf-matcher__option:hover { box-shadow: inset 0 0 0 1.5px var(--green); }
.pf-matcher__option.is-active { box-shadow: inset 0 0 0 2px var(--green); background: var(--green-12); }
.pf-matcher__option .emo { font-size: 28px; margin-bottom: 8px; }
.pf-matcher__option .label { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin-bottom: 6px; }
.pf-matcher__option .desc { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
.pf-matcher__actions { display: flex; justify-content: space-between; align-items: center; padding-top: 16px; border-top: 1px solid var(--ink-08); }
.pf-matcher__transition {
  background: var(--gold-16); border-radius: 14px; padding: 18px 20px;
  margin-bottom: 24px; font-size: 14px; line-height: 1.5;
}

/* Match result */
.pf-result { padding: 24px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-1); margin-bottom: 16px; }
.pf-result.alt { box-shadow: var(--shadow-1), inset 4px 0 0 var(--terracotta); }
.pf-result__head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 14px; }
.pf-result__rank {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; background: var(--gold-16); border-radius: 100px;
  font-size: 12px; font-weight: 600;
}
.pf-result__title { font-family: var(--font-display); font-weight: 600; font-size: 28px; line-height: 1.15; margin-bottom: 6px; }
.pf-result__meta { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
.pf-result__bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.pf-result__bar .track { flex: 1; height: 8px; background: var(--ink-08); border-radius: 100px; overflow: hidden; }
.pf-result__bar .fill { height: 100%; background: var(--green); border-radius: 100px; }
.pf-result__bar .pct { font-weight: 600; font-family: ui-monospace, Menlo, monospace; font-size: 13px; min-width: 38px; text-align: right; }

/* Common page shell */
.pf-page { padding: 56px 0; }
.pf-page__head { margin-bottom: 32px; max-width: 720px; }
.pf-page__head .display-2 { font-size: 44px; line-height: 48px; margin-bottom: 12px; }
.pf-page__head .lead { font-size: 17px; }

/* Switch / pills group for regional lens */
.pf-lens {
  display: inline-flex; padding: 4px; background: var(--surface);
  border-radius: 100px; box-shadow: inset 0 0 0 1px var(--ink-08); gap: 4px;
}
.pf-lens button {
  border: none; background: transparent; padding: 8px 16px; border-radius: 100px;
  font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text);
  transition: background var(--t-fast), color var(--t-fast);
}
.pf-lens button.is-active { background: var(--green); color: #fff; }

/* Subject grid pulse on lens change */
@keyframes pf-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.pf-pulse { animation: pf-pulse 400ms ease; }

/* Section header (with compass glyph) */
.pf-section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.pf-section-head svg { color: var(--green-dark); }
.pf-section-head h2 { line-height: 1.1; }

/* Inline divider for matcher steps + back link */
.pf-link { color: var(--green); font-weight: 600; cursor: pointer; background: none; border: none; font-family: inherit; font-size: 14px; padding: 0; }
.pf-link:hover { color: var(--green-dark); }

/* Tags row */
.pf-tagrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* Responsive — collapse */
@media (max-width: 880px) {
  .pf-hero__grid, .pf-features__grid, .pf-how__grid, .pf-careers, .pf-grid-3, .pf-timeline, .pf-stats__grid, .pf-footer__grid, .pf-matcher__chips, .pf-matcher__cards, .pf-grid-2 { grid-template-columns: 1fr; }
  .pf-hero__viz { height: 360px; }
  .pf-hero__title .display-1 { font-size: 44px; line-height: 1.05;}
}

/* ============================================================
   12 / 8 / 4 column grid system
   ============================================================ */

.pf-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 24px;
  width: 100%;
}
.pf-grid--tight { gap: 16px; }
.pf-grid--loose { gap: 32px; }

/* Column-span utilities (web: 12-col) */
.pf-col-12 { grid-column: span 12; }
.pf-col-10 { grid-column: span 10; }
.pf-col-9  { grid-column: span 9; }
.pf-col-8  { grid-column: span 8; }
.pf-col-7  { grid-column: span 7; }
.pf-col-6  { grid-column: span 6; }
.pf-col-5  { grid-column: span 5; }
.pf-col-4  { grid-column: span 4; }
.pf-col-3  { grid-column: span 3; }
.pf-col-2  { grid-column: span 2; }
.pf-col-1  { grid-column: span 1; }

/* Tablet — 8-col grid */
@media (max-width: 1100px) {
  .pf-grid { grid-template-columns: repeat(8, 1fr); gap: 20px; }
  /* Web-12 spans map onto the 8-col grid */
  .pf-col-12 { grid-column: span 8; }
  .pf-col-10 { grid-column: span 8; }
  .pf-col-9  { grid-column: span 8; }
  .pf-col-8  { grid-column: span 8; }
  .pf-col-7  { grid-column: span 8; }
  .pf-col-6  { grid-column: span 4; }      /* halves on tablet */
  .pf-col-5  { grid-column: span 4; }
  .pf-col-4  { grid-column: span 4; }      /* 2 across on tablet */
  .pf-col-3  { grid-column: span 4; }
  .pf-col-2  { grid-column: span 2; }
}

/* Mobile — 4-col grid */
@media (max-width: 700px) {
  .pf-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .pf-col-12, .pf-col-10, .pf-col-9, .pf-col-8, .pf-col-7, .pf-col-6, .pf-col-5, .pf-col-4, .pf-col-3 { grid-column: span 4; }
  .pf-col-2 { grid-column: span 2; }
  .pf-col-1 { grid-column: span 1; }
}

/* ============================================================
   Bookmark / save button on testimonials
   ============================================================ */

.pf-save {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background var(--t-fast), color var(--t-fast);
  flex-shrink: 0;
  padding: 0;
}
.pf-save:hover { background: var(--ink-08); color: var(--text); }
.pf-save.is-saved { color: var(--gold); }
.pf-save.is-saved:hover { background: var(--gold-16); }
.pf-save svg { width: 20px; height: 20px; }

.pf-save__chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; padding: 6px 12px;
  border: none; cursor: pointer; font-family: inherit;
}
.pf-save__chip.is-active { background: var(--gold); color: var(--text); }


.pf-landing-section { padding: 96px 0; position: relative; }
.pf-section--alt { background: var(--surface-alt); }
.pf-narrow { max-width: 960px !important; margin: 0 auto; padding: 0 24px; }

/* ── Editorial hero ── */
.pf-hero--editorial { min-height: calc(100vh - var(--nav-h)); padding: 96px 0 64px; display: flex; flex-direction: column; justify-content: center; overflow: hidden; position: relative; }
.pf-hero__editorial { max-width: 980px; }
.pf-hero__h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(56px, 9vw, 120px);
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 12px 0 28px;
  color: var(--text);
  text-wrap: pretty;
  display: flex; flex-direction: column;
}
.pf-hero__h1 em.gold-em { font-style: italic; color: var(--gold); font-weight: 500; }

/* SplitText mask container — each line is masked, the inner span animates up from below */
.pf-mask { overflow: hidden; display: block; padding-bottom: 0.08em; }
.pf-mask > span { display: inline-block; will-change: transform; }

.pf-hero--editorial .pf-hero__sub { font-size: clamp(17px, 1.6vw, 22px); line-height: 1.5; color: var(--text-muted); max-width: 660px; margin: 0 0 36px; }
.pf-hero--editorial .pf-hero__trust { display: flex; gap: 22px; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); margin-top: 28px; }

.pf-hero__scrollhint {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 14px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-muted);
}
.pf-hero__scrollhint-line {
  width: 1.5px; height: 36px; background: var(--text-muted); opacity: 0.5;
  animation: pf-scroll-pulse 2s ease-in-out infinite;
  transform-origin: top;
}
@keyframes pf-scroll-pulse { 0%,100% { transform: scaleY(0.4); opacity:0.4;} 50% { transform: scaleY(1); opacity: 0.9; } }

/* ── Three.js starfield host ── */
.pf-starfield { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: 0.6; }
.pf-hero > .pf-container { position: relative; z-index: 1; }

/* ── PINNED BRUTAL REALITY ── */
.pf-reality {
  position: relative;
  height: 380vh; /* gives ScrollTrigger room to advance through the three stats */
}
.pf-reality__pin {
  position: sticky; top: 0;
  height: 100vh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.pf-reality__bg {
  position: absolute; inset: 0;
  background: var(--bg);
  transition: background var(--t-slow) var(--ease-editorial);
}
.pf-reality__bg[data-pf-bg-state="green"] { background: var(--green-dark); }

.pf-reality__inner {
  position: relative; z-index: 2;
  max-width: 1100px; padding: 0 32px;
  width: 100%;
}
.pf-reality__eyebrow {
  color: var(--text-muted);
  margin: 0 0 48px;
  display: inline-block;
  transition: color var(--t-mid);
}
.pf-reality[data-bg="green"] .pf-reality__eyebrow,
.pf-reality__pin[data-bg="green"] .pf-reality__eyebrow { color: rgba(255,255,255,0.7); }

.pf-reality__stack { position: relative; }
.pf-reality__stat {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 56px;
  align-items: center;
  opacity: 0;
  transform: translateY(40px);
  will-change: opacity, transform;
}
.pf-reality__num {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(120px, 18vw, 240px);
  line-height: 0.85;
  letter-spacing: -0.04em;
  color: var(--text);
  display: flex; align-items: baseline; gap: 0;
}
.pf-reality__num--bold { color: var(--gold); }
.pf-reality__num--frac { font-size: 0.42em; opacity: 0.7; margin-left: 6px; }
.pf-reality__lbl {
  font-family: var(--font-display);
  font-size: clamp(20px, 2.4vw, 32px);
  line-height: 1.3;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -0.01em;
  text-wrap: pretty;
}
/* Color-swap once the green background takes over */
.pf-reality__pin[data-bg="green"] .pf-reality__num,
.pf-reality__pin[data-bg="green"] .pf-reality__lbl { color: #fff; }

.pf-reality__rule {
  opacity: 0;
  transform: translateY(30px);
  text-align: left;
  font-family: var(--font-display);
}
.pf-reality__rule-q {
  font-size: clamp(28px, 3.4vw, 44px);
  line-height: 1.2;
  font-weight: 500;
  color: #fff;
  font-style: italic;
  letter-spacing: -0.01em;
  max-width: 920px;
  text-wrap: pretty;
}
.pf-reality__rule-attr {
  font-family: var(--font-body);
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
  margin-top: 16px;
}

/* Background floating quote snippets */
.pf-reality__quotes {
  position: absolute; inset: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--t-slow);
}
.pf-reality__pin[data-bg="green"] .pf-reality__quotes { opacity: 1; }
.pf-reality__quote {
  position: absolute;
  max-width: 280px;
  font-family: var(--font-display);
  font-style: italic;
  font-size: 14px;
  line-height: 1.4;
  color: rgba(255,255,255,0.15);
  filter: blur(0.5px);
}
.pf-reality__qwho {
  font-family: var(--font-body);
  font-style: normal;
  font-size: 11px;
  color: rgba(244,168,35,0.4);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── 31-dot grid (kept for any usage; not on landing anymore) ── */
.pf-dotgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 14px; max-width: 720px; margin: 48px 0 32px; }
.pf-dot { width: 100%; aspect-ratio: 1; border-radius: 8px; background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-16); }
.pf-dot--filled { background: var(--green); box-shadow: 0 1px 2px rgba(26,23,20,0.06); }
.pf-dotgrid__legend { display: flex; flex-direction: column; gap: 12px; margin-top: 8px; }
.pf-dotgrid__row { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--text-muted); }
.pf-dotgrid__row .pf-dot { width: 16px; height: 16px; flex-shrink: 0; }

function SectionHead({ title, eyebrow, sub }) {

function StatsStrip({ items }) {
  return (
    <section className="pf-stats">
      <div className="pf-stats__grid">
        {items.map((s, i) => (
          <div key={i}>

          </div>
        ))}
      </div>
    </section>

}

function HonestyBox({ label, children }) {
  return (
    <div className="honesty">
      {label ? <div style={{fontFamily:"var(--font-body)",fontWeight:700,fontSize:12,letterSpacing:".05em",textTransform:"uppercase",color:"var(--terracotta)",marginBottom:6}}>{label}</div> : null}
      <div style={{fontSize:14,lineHeight:1.5,color:"var(--text)"}}>{children}</div>
    </div>
  );
}

// Initials avatar — gradient circle.
// Use `name` if given; otherwise derive initials from subject (first letter of each word, up to 2).
function Avatar({ name, subjectName, field, size = 48 }) {
  let initials;
  if (name) {
    initials = name.split(" ").map(p => p[0]).slice(0, 2).join("").toUpperCase();
  } else if (subjectName) {
    const words = subjectName.split(/[\s&()]+/).filter(w => w.length > 0 && /^[A-Z]/.test(w[0]));
    initials = words.slice(0, 2).map(w => w[0]).join("").toUpperCase() || subjectName.slice(0, 2).toUpperCase();
  } else {
    initials = "··";
  }
  const color = (PFData.FIELDS[field] && PFData.FIELDS[field].color) || "#006A4E";
  return (
    <div
      className="pf-av"
      style={{
        width: size, height: size, fontSize: size * 0.38,
        background: `radial-gradient(circle at 30% 30%, ${color}cc, ${color} 70%)`,
      }}
    >
      {initials}
    </div>
  );
}

// Field-color top border helper
function fieldColor(field) {
  return (PFData.FIELDS[field] && PFData.FIELDS[field].color) || "#006A4E";
}

// Difficulty dots
function DiffDots({ level }) {
  return (
    <span className="pf-scard__dots">
      Difficulty
      {[1,2,3,4].map(i => (<span key={i} className={"d" + (i <= level ? " on" : "")}/>))}
    </span>
  );
}

// Trend pill
function TrendPill({ trend }) {
  if (trend === "rising") return <span className="pill pill-gold" style={{fontSize:11,padding:"4px 10px"}}>📈 Rising</span>;
  if (trend === "stable") return <span className="pill" style={{fontSize:11,padding:"4px 10px"}}>⟶ Stable</span>;
  return <span className="pill" style={{fontSize:11,padding:"4px 10px"}}>◎ Niche</span>;
}

// Confidence-tier badge — names match the EduPath BD Build Plan §4.1.
function ConfidencePill({ tier }) {
  const map = {
    listed:   { bg: "#FBEFD0", fg: "#7A5400", label: "Listed only — limited evidence" },
    emerging: { bg: "#DCEAF7", fg: "#1F4F86", label: "Emerging evidence" },
    verified: { bg: "#E2F1EA", fg: "#0A5E44", label: "Verified" },
  };
  const m = map[tier] || map.emerging;
  return <span style={{display:"inline-flex",alignItems:"center",padding:"4px 12px",borderRadius:100,background:m.bg,color:m.fg,fontSize:12,fontWeight:600}}>{m.label}</span>;
}

Object.assign(window, { Nav, Footer, SectionHead, StatsStrip, HonestyBox, Avatar, fieldColor, DiffDots, TrendPill, ConfidencePill });

})();
</script>

<script type="text/babel" data-presets="react">
(function(){
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// EduPath BD — SubjectCard + TestimonialCard

function SubjectCard({ subject, onClick }) {
  const fc = fieldColor(subject.field);
  const fieldLabel = PFData.FIELDS[subject.field].label;
  return (
    <button className="pf-scard" onClick={onClick} type="button" style={{textAlign:"left",border:"none",font:"inherit",color:"inherit",padding:0,background:"var(--surface)"}}>
      <div className="pf-scard__top" style={{background: fc}}/>
      <div className="pf-scard__body">
        <div className="pf-scard__meta">
          <span className="pill" style={{fontSize:11,padding:"4px 10px"}}>{fieldLabel}</span>
          <TrendPill trend={subject.trend}/>
        </div>
        <div className="pf-scard__name">{subject.name}</div>
        <div className="pf-scard__desc">{subject.desc}</div>
        <div className="pf-scard__hsc">
          {subject.hsc.map(h => <span key={h} className="pill" style={{fontSize:11,padding:"4px 10px"}}>· {h}</span>)}
          {subject.math ? <span className="pill" style={{fontSize:11,padding:"4px 10px"}}>· Math required</span> : null}
        </div>
        <DiffDots level={subject.difficulty}/>
        <div className="pf-scard__foot">
          <div className="pf-scard__sal">{subject.regional.dhaka.salary}</div>
          <div className="pf-scard__arr">→</div>
        </div>
      </div>
    </button>
  );
}

// Truncate long subject names for the chip
function shortSubject(name) {
  if (!name) return "";
  const map = {
    "Computer Science & Engineering": "CSE",
    "Business Administration (BBA)":  "BBA",
    "Electrical & Electronic Engineering": "EEE",
    "Information & Communication Engineering": "ICE",
    "Civil & Environmental Engineering": "Civil Engg.",
    "Geography & Environment": "Geography",
    "English Language & Literature": "English Lit.",
    "Journalism & Media Studies": "Journalism",
  };
  if (map[name]) return map[name];
  return name.length > 18 ? name.split(" ")[0] : name;
}

// Country flag emoji
function flagFor(country) {
  return ({ BD: "🇧🇩", US: "🇺🇸", KR: "🇰🇷", AU: "🇦🇺", OTHER: "🌐" })[country] || "🌐";
}

function TestimonialCard({ t, expanded, onToggle, compact = false }) {
  const subj = PFData.subjects.find(s => s.slug === t.subjectSlug);
  const fieldKey = subj ? subj.field : (t.field || "social-science");
  const subjName = t.subjectName || (subj && subj.name) || t.subjectSlug;
  const headline = t.name
    ? `${t.name} · ${t.age}`
    : `Class of ${t.session || "—"}  ·  age ${t.age}`;
  return (
    <div className="pf-tcard">
      <div className="pf-tcard__head">
        <div className="pf-tcard__who">
          <Avatar name={t.name} subjectName={subjName} field={fieldKey} size={48}/>
          <div>
            <div className="pf-tcard__name">{headline}</div>
            <div className="pf-tcard__sub">{flagFor(t.country)} {t.city || (t.country === "BD" ? "Bangladesh" : "—")}</div>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:6,alignItems:"flex-end",alignSelf:"flex-start"}}>
          {t.verified ? <span className="pf-verified">Real survey response</span> : null}
          <span className="pill" style={{fontSize:11,padding:"4px 10px"}}>{shortSubject(subjName)}</span>
        </div>
      </div>
      <div className="small" style={{color:"var(--text-muted)"}}>{t.uni}{t.role ? <> · <span className="pf-tcard__role">{t.role}</span></> : null}</div>
      <div>
        <div className="pf-tcard__mark">"</div>
        <div className="pf-tcard__quote">{t.good}</div>
      </div>
      {expanded ? (
        <div className="pf-tcard__expand">
          <div><h5>What was hard</h5><p>{t.bad}</p></div>
          <div><h5>Who should take it</h5><p>{t.whoShould}</p></div>
          <div><h5>Who shouldn't</h5><p>{t.whoShouldnt}</p></div>
          <div><h5>Career paths the respondent has seen</h5><p>{t.opportunities}</p></div>
          {t.alternative ? <div><h5>If choosing again</h5><p style={{fontStyle:"italic"}}>"{t.alternative}"</p></div> : null}
        </div>
      ) : null}
      {!compact ? (
        <div className="pf-tcard__foot">
          {t.again === "yes"    ? <span className="pill pill-ok">✅ Would recommend</span> : null}
          {t.again === "no"     ? <span className="pill pill-sw">🔄 Would not recommend</span> : null}
          {t.again === "unsure" ? <span className="pill pill-note">🤔 Unsure</span> : null}
          {onToggle ? <button className="pf-link" onClick={onToggle}>{expanded ? "Show less ↑" : "Read full response ↓"}</button> : null}
        </div>
      ) : null}
    </div>
  );
}

Object.assign(window, { SubjectCard, TestimonialCard, flagFor, shortSubject });

})();

<script type="text/babel" data-presets="react">
(function(){
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// EduPath BD — Stories wall

function ScreenStories({ go }) {
  const [filter, setFilter] = useState("all"); // all | yes | no | abroad
  const [fieldFilter, setFieldFilter] = useState("all");
  const [expanded, setExpanded] = useState(new Set());

  const toggle = (i) => {

    if (n.has(i)) n.delete(i); else n.add(i);
    setExpanded(n);
  };

  const filtered = PFData.testimonials.filter(t => {
    if (filter === "yes" && t.again !== "yes") return false;
    if (filter === "no"  && t.again !== "no")  return false;
    if (filter === "abroad" && t.country === "BD") return false;
    if (fieldFilter !== "all") {
      const subj = PFData.subjects.find(s => s.slug === t.subjectSlug);
      const fieldOnSubject = subj ? subj.field : t.field;
      if (fieldOnSubject !== fieldFilter) return false;
    }
    return true;
  });

  return (
    <div>
      <div className="pf-stickybar">
        <div className="pf-stickybar__inner">
          <div className="pf-tagrow">

          <select value={fieldFilter} onChange={e => setFieldFilter(e.target.value)}

  );

// 7-step questionnaire covering the AI Matcher Spec's 14 questions (A1–A7, B1–B7).
// Steps 1–4 = Layer 01 (Interest & working style). Steps 5–7 = Layer 02 (Constraints).
// The scoring heuristic remains intentionally lightweight; the spec describes the
// real retrieval-grounded model that lives server-side in production.

const INTERESTS = [
  ["building",  "🔧", "Building & fixing",      "Hardware, construction, hands-on systems"],
  ["puzzles",   "🧩", "Puzzles & math",         "Rules, algorithms, optimization"],
  ["writing",   "✍️", "Writing & language",     "Stories, prose, communication"],
  ["people",    "🤝", "Helping people",         "Counseling, teaching, social impact"],
  ["art",       "🎨", "Art, design & visuals",  "Drawing, branding, products"],
  ["nature",    "🌿", "Nature & living things", "Biology, environment, agriculture"],
  ["business",  "💰", "Business & markets",     "Money, trade, organisations"],
  ["lab",       "🧪", "Experiments & lab work", "Hypotheses, data, the bench"],
  ["computers", "💻", "Computers & software",   "Programming, products, the web"],
  ["society",   "🏛️", "Law, society & policy",  "How things are governed"],

const DRIVERS = [

  ["aesthetic", "🎨", "Creating something good-looking"],
  ["impact",    "🤲", "The impact on people"],
  ["payoff",    "💰", "The money / career payoff"],
  ["curiosity", "🔍", "Pure curiosity"],
];

// ── A3: Mathematics comfort ──
const MATH_OPTS = [
  ["love",  "❤️", "I enjoy it",      "Calculus, proofs, problems all feel satisfying."],
  ["ok",    "👍", "I can handle it", "Applied math is fine when the goal is clear."],
  ["avoid", "🙅", "I'd rather not",  "I'd prefer a path with minimal calculation."],
];

// ── A4: Memorization tolerance ──
const MEMORIZATION = [
  ["fine",   "📚", "Fine with it",            "Memorising names, dates, facts is okay."],
  ["mid",    "🆗", "Tolerable in doses",      "I can do it but it's not enjoyable."],
  ["reason", "💡", "Strongly prefer reasoning", "I want to work things out, not memorise them."],
];

// ── A5: Open vs closed problems ──
const PROBLEM_STYLE = [
  ["closed", "🎯", "A clear right answer"],
  ["open",   "🌫️", "Open problems with many answers"],
  ["mix",    "⚖️", "A mix of both"],
];

// ── A6: Working environment ──
const WORK_ENV = [
  ["desk",    "💻", "At a desk / on a computer"],
  ["lab",     "🔬", "In a lab or in the field"],
  ["people",  "🗣️", "With and among people"],
  ["site",    "🏗️", "On a site / hands-on"],
  ["flex",    "🌀", "Flexible / varied"],
];

// ── B1: HSC group ──
const HSC = [
  ["science",  "🔬", "Science",
   "Opens CSE, Engineering, Physics, Architecture, Agriculture, Medicine, Geography, Psychology"],
  ["commerce", "📊", "Commerce / Business Studies",
   "Opens BBA, Finance & Banking, Economics, Accounting, Management"],
  ["arts",     "🎭", "Humanities / Arts",
   "Opens Bangla, English Lit, History, Philosophy, Development Studies, Social Work, Geography"],
  ["any",      "🤔", "Not sure / different board",
   "Show me all paths — I'll filter by interest only"],
];

// ── B2: Results band ──
const RESULTS_BAND = [
  ["strong",  "Strong results",      "GPA close to the top of my college"],
  ["average", "Average",             "Around the middle of my class"],
  ["below",   "Below what I hoped",  "I want a realistic path given where I am"],
];

// ── B3: Family budget ──
const BUDGET = [
  ["public",  "Public university only",   "Cost is a real constraint"],
  ["private", "Private is an option",     "We can stretch if the path is right"],
  ["unsure",  "Not sure yet",             "Don't filter on this yet"],
];

// ── B4: Where you can study ──
const LOCATION = [
  ["home",     "Home division only",          "I can't relocate yet"],
  ["national", "Anywhere in Bangladesh",      "I can move within the country"],
  ["global",   "Anywhere — including abroad", "Open to studying outside BD"],
];

// ── B5: Abroad intent ──
const ABROAD = [
  ["yes",   "✈️", "Yes — it's a goal",    "Boosts subjects with strong abroad pathways"],
  ["maybe", "🤔", "Maybe",                "Treat it as a soft preference"],
  ["stay",  "🏠", "No — I plan to stay",  "Local opportunities ranked higher"],
];

// ── B6: Career risk appetite ──
const RISK = [
  ["stable", "🛡️", "Stable, predictable",      "Banking, govt, established sectors"],
  ["upside", "🚀", "Trade some stability for upside", "Tech, startups, finance"],
  ["unsure", "🤷", "Unsure yet",                "Show me both"],
];

// ── Reusable sub-question chip-row component ──
function MatcherChip({ emo, label, desc, active, onClick, small = false }) {
  return (
    <button className={"pf-matcher__chip" + (active ? " is-active" : "")} onClick={onClick} type="button" style={small ? {padding:"10px 14px"} : null}>
      <span className="emo">{emo}</span>
      <span>
        <div className="label">{label}</div>
        {desc ? <div className="desc">{desc}</div> : null}
      </span>
    </button>
  );
}
function MatcherOption({ emo, label, desc, active, onClick }) {
  return (
    <button className={"pf-matcher__option" + (active ? " is-active" : "")} onClick={onClick} type="button">
      {emo ? <div className="emo">{emo}</div> : null}
      <div className="label">{label}</div>
      {desc ? <div className="desc">{desc}</div> : null}
    </button>
  );
}
// Sub-question wrapper — a small label + the chip row below
function SubQ({ label, hint, children }) {
  return (
    <div style={{marginBottom: 24}}>
      <div className="micro" style={{marginBottom: 8}}>{label}</div>
      {hint ? <div style={{fontSize: 14, color: "var(--text-muted)", marginBottom: 12, lineHeight: 1.4}}>{hint}</div> : null}
      {children}
    </div>
  );
}

function ScreenMatcher({ go }) {
  const [step, setStep] = useState(1); // 1..7
  const [phase, setPhase] = useState("step"); // step | processing | results

  // Layer 01 — interests & working style
  const [interests, setInterests] = useState(new Set());
  const [driver, setDriver] = useState(null);
  const [math, setMath] = useState(null);
  const [memorization, setMemorization] = useState(null);
  const [problemStyle, setProblemStyle] = useState(null);
  const [workEnv, setWorkEnv] = useState(null);
  const [curiosity, setCuriosity] = useState("");

  // Layer 02 — constraints
  const [hsc, setHsc] = useState(null);
  const [resultsBand, setResultsBand] = useState(null);
  const [budget, setBudget] = useState(null);
  const [location, setLocation] = useState(null);
  const [abroad, setAbroad] = useState(null);
  const [risk, setRisk] = useState(null);
  const [pushed, setPushed] = useState("");

  const toggle = (set, key, max) => {
    const n = new Set(set);
    if (n.has(key)) n.delete(key);
    else if (!max || n.size < max) n.add(key);
    return n;
  };

  const TOTAL = 7;
  const layer2 = step >= 5;
  const progress = (step / TOTAL) * 100;

  const canNext = () => {
    if (step === 1) return interests.size >= 1;
    if (step === 2) return driver && problemStyle;
    if (step === 3) return math && memorization;
    if (step === 4) return workEnv !== null;
    if (step === 5) return hsc !== null;
    if (step === 6) return resultsBand && budget && location;
    if (step === 7) return abroad && risk;
    return false;
  };

  const onNext = () => {
    if (step < TOTAL) { setStep(step + 1); return; }
    setPhase("processing");
    setTimeout(() => setPhase("results"), 1800);
  };
  const onBack = () => {
    if (phase === "results") { setPhase("step"); setStep(TOTAL); return; }
    if (step > 1) setStep(step - 1);
  };

  if (phase === "processing") return <Processing/>;
  if (phase === "results") return (
    <Results
      inputs={{ interests, driver, math, memorization, problemStyle, workEnv, curiosity, hsc, resultsBand, budget, location, abroad, risk, pushed }}
      go={go}
      onRetry={() => { setPhase("step"); setStep(1); }}
    />
  );

  // HSC live-preview
  let hscPreview = null;
  if (step === 5 && hsc) {
    const map = {
      science:  "✓ You're eligible for the widest range of subjects. You can access all profiled subjects in our database.",
      commerce: "✓ You're eligible for Business, Economics, Finance and most Arts subjects. ⚠ Engineering, Physics, Architecture, Agriculture, Medicine typically require Science group admission.",
      arts:     "✓ You're eligible for most Arts and Social Science subjects. ⚠ CSE, Engineering, Physics, Architecture, Agriculture, Medicine, Geography typically require Science group admission.",
      any:      "We'll filter by your interest signals alone — and surface subjects with the lowest HSC-group friction first.",
    };
    hscPreview = <HonestyBox label="Eligibility preview">{map[hsc]}</HonestyBox>;
  }

  return (
    <div className="pf-matcher">
      <div className="pf-matcher__card">
        <div className="pf-matcher__progress">
          <div className="micro">
            <span>Step {step} of {TOTAL}</span>
            <span className="right">≈ {Math.max(1, TOTAL - step + 1)} min remaining</span>
          </div>
          <div className="pf-matcher__track">
            <div className={"pf-matcher__fill" + (layer2 ? " l2" : "")} style={{width: progress + "%"}}/>
          </div>
        </div>

        <div className={"pf-matcher__layer" + (layer2 ? " l2" : "")}>
          {layer2 ? "Layer 02 · Constraints & context" : "Layer 01 · Interests & working style"}
        </div>

        {/* STEP 1 — A1 Interests */}
        {step === 1 && (
          <>
            <h2 className="pf-matcher__q">Which of these activities genuinely hold your attention?</h2>
            <p className="pf-matcher__sub">Pick any number, up to five. There are no wrong answers.</p>
            <div className="pf-matcher__chips">
              {INTERESTS.map(([k, e, l, d]) => (
                <MatcherChip key={k} emo={e} label={l} desc={d} active={interests.has(k)} onClick={() => setInterests(toggle(interests, k, 5))}/>
              ))}
            </div>
          </>
        )}

        {/* STEP 2 — A2 Driver + A5 Problem style */}
        {step === 2 && (
          <>
            <h2 className="pf-matcher__q">A little about how you work.</h2>
            <p className="pf-matcher__sub">Be honest — these answers affect which paths feel sustainable.</p>
            <SubQ label="When a task is hard, what keeps you going?">
              <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(2, 1fr)"}}>
                {DRIVERS.map(([k, e, l]) => (
                  <MatcherChip key={k} emo={e} label={l} active={driver === k} onClick={() => setDriver(k)} small/>
                ))}
              </div>
            </SubQ>
            <SubQ label="Which appeals more?">
              <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {PROBLEM_STYLE.map(([k, e, l]) => (
                  <MatcherChip key={k} emo={e} label={l} active={problemStyle === k} onClick={() => setProblemStyle(k)} small/>
                ))}
              </div>
            </SubQ>
          </>
        )}

        {/* STEP 3 — A3 Math + A4 Memorization */}
        {step === 3 && (
          <>
            <h2 className="pf-matcher__q">Two cognitive realities.</h2>
            <p className="pf-matcher__sub">Heavy math and heavy memorization both rule out certain paths — be honest now and save four years.</p>
            <SubQ label="How do you feel about mathematics?">
              <div className="pf-matcher__cards" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {MATH_OPTS.map(([k, e, l, d]) => (
                  <MatcherOption key={k} emo={e} label={l} desc={d} active={math === k} onClick={() => setMath(k)}/>
                ))}
              </div>
            </SubQ>
            <SubQ label="How do you feel about a lot of memorization?">
              <div className="pf-matcher__cards" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {MEMORIZATION.map(([k, e, l, d]) => (
                  <MatcherOption key={k} emo={e} label={l} desc={d} active={memorization === k} onClick={() => setMemorization(k)}/>
                ))}
              </div>
            </SubQ>
          </>
        )}

        {/* STEP 4 — A6 Work env + A7 Free text */}
        {step === 4 && (
          <>
            <h2 className="pf-matcher__q">Where do you want to spend your working day?</h2>
            <p className="pf-matcher__sub">A real preference — not the one that "sounds good."</p>
            <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(2, 1fr)"}}>
              {WORK_ENV.map(([k, e, l]) => (
                <MatcherChip key={k} emo={e} label={l} active={workEnv === k} onClick={() => setWorkEnv(k)} small/>
              ))}
            </div>
            <SubQ label="In a few words — what are you naturally curious about, or good at?" hint="Optional. Helps the matcher reason about your specific interests, not just buckets.">
              <textarea
                value={curiosity}
                onChange={e => setCuriosity(e.target.value)}
                placeholder="e.g. how cities are planned · machine learning · economics of Bangladesh"
                rows={3}
                style={{width:"100%",padding:"12px 14px",border:"1.5px solid var(--ink-16)",borderRadius:"var(--r-input)",background:"var(--bg)",fontFamily:"inherit",fontSize:14,lineHeight:1.5,outline:"none",resize:"vertical"}}
              />
            </SubQ>
          </>
        )}

        {/* STEP 5 — B1 HSC */}
        {step === 5 && (
          <>
            <div className="pf-matcher__transition">
              <strong>Good.</strong> Now the real-world filters. These shape what's actually available to you in Bangladesh.
            </div>
            <h2 className="pf-matcher__q">Which stream did you study in HSC?</h2>
            <p className="pf-matcher__sub">This is the hard filter — it gates which subjects you can admit into.</p>
            <div className="pf-matcher__cards">
              {HSC.map(([k, e, l, d]) => (
                <MatcherOption key={k} emo={e} label={l} desc={d} active={hsc === k} onClick={() => setHsc(k)}/>
              ))}
            </div>
            {hscPreview ? <div style={{marginBottom: 16}}>{hscPreview}</div> : null}
          </>
        )}

        {/* STEP 6 — B2 Results + B3 Budget + B4 Location */}
        {step === 6 && (
          <>
            <h2 className="pf-matcher__q">The practical realities.</h2>
            <p className="pf-matcher__sub">These are soft filters — they shape which universities are surfaced, not which subjects you can pick.</p>
            <SubQ label="Roughly, how did your results go?">
              <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {RESULTS_BAND.map(([k, l, d]) => (
                  <MatcherChip key={k} emo="" label={l} desc={d} active={resultsBand === k} onClick={() => setResultsBand(k)} small/>
                ))}
              </div>
            </SubQ>
            <SubQ label="Which is realistic for your family right now?">
              <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {BUDGET.map(([k, l, d]) => (
                  <MatcherChip key={k} emo="" label={l} desc={d} active={budget === k} onClick={() => setBudget(k)} small/>
                ))}
              </div>
            </SubQ>
            <SubQ label="Where can you realistically study?">
              <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {LOCATION.map(([k, l, d]) => (
                  <MatcherChip key={k} emo="" label={l} desc={d} active={location === k} onClick={() => setLocation(k)} small/>
                ))}
              </div>
            </SubQ>
          </>
        )}

        {/* STEP 7 — B5 Abroad + B6 Risk + B7 Pushed (optional) */}
        {step === 7 && (
          <>
            <h2 className="pf-matcher__q">A few last calibrations.</h2>
            <p className="pf-matcher__sub">These tune the mix — never the eligibility.</p>
            <SubQ label="Do you hope to study or work abroad eventually?">
              <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {ABROAD.map(([k, e, l, d]) => (
                  <MatcherChip key={k} emo={e} label={l} desc={d} active={abroad === k} onClick={() => setAbroad(k)} small/>
                ))}
              </div>
            </SubQ>
            <SubQ label="How do you feel about career risk?">
              <div className="pf-matcher__chips" style={{gridTemplateColumns: "repeat(3, 1fr)"}}>
                {RISK.map(([k, e, l, d]) => (
                  <MatcherChip key={k} emo={e} label={l} desc={d} active={risk === k} onClick={() => setRisk(k)} small/>
                ))}
              </div>
            </SubQ>
            <SubQ label="Is there a subject already being pushed on you by others?" hint="Optional. Used only to gently widen the shortlist beyond the one path you've been told to take — never to dismiss it.">
              <input
                type="text"
                value={pushed}
                onChange={e => setPushed(e.target.value)}
                placeholder="e.g. CSE · Doctor (MBBS) · BBA"
                style={{width:"100%",padding:"12px 14px",border:"1.5px solid var(--ink-16)",borderRadius:"var(--r-input)",background:"var(--bg)",fontFamily:"inherit",fontSize:14,outline:"none"}}
              />
            </SubQ>
          </>
        )}

        <div className="pf-matcher__actions">
          {step > 1 ? <button className="pf-link" onClick={onBack}>← Back</button> : <span/>}
          <button className="btn btn-primary" onClick={onNext} disabled={!canNext()} style={{opacity: canNext() ? 1 : 0.5, cursor: canNext() ? "pointer" : "not-allowed"}}>
            {step < TOTAL ? "Continue →" : "See my matches →"}
          </button>
        </div>
      </div>
    </div>
  );
}

function Processing() {
  const lines = [
    "Building your interest profile…",
    "Applying eligibility rules…",
    "Retrieving subjects + testimonials…",
    "Asking the model to reason over the evidence…",
  ];
  const [i, setI] = useState(0);
  useEffect(() => {
    const ts = [
      setTimeout(() => setI(1), 500),
      setTimeout(() => setI(2), 1000),
      setTimeout(() => setI(3), 1500),
    ];
    return () => ts.forEach(clearTimeout);
  }, []);
  return (
    <div className="pf-matcher">
      <div className="pf-matcher__card" style={{textAlign:"center", padding: "64px 44px"}}>
        <div style={{margin: "0 auto 32px",width:"60%",height:6,background:"var(--ink-08)",borderRadius:100,overflow:"hidden",position:"relative"}}>
          <div style={{height:"100%",width:"30%",background:"var(--green)",borderRadius:100,animation:"pf-sweep 1.5s linear infinite",position:"absolute",left:"-30%"}}/>
        </div>
        <style>{`@keyframes pf-sweep { from {left:-30%;} to {left:100%;} }`}</style>
        <div style={{fontFamily:"var(--font-display)",fontWeight:600,fontSize:22,lineHeight:1.3,color:"var(--text)"}}>{lines[i]}</div>
      </div>
    </div>
  );
}

// ── Scoring heuristic — uses more signals now that the questionnaire is fuller ──
function scoreSubject(s, inputs) {
  let score = 50;

  // A1 → interest cluster overlap
  const interestMap = {
    "cse":                 ["puzzles","computers","building"],
    "agriculture":         ["nature","lab"],
    "bba":                 ["business","people"],
    "economics":           ["puzzles","business","society"],
    "uiux":                ["art","computers"],
    "english-lit":         ["writing","society"],
    "development-studies": ["people","society","writing"],
    "geography":           ["nature","society","lab"],
    "finance-banking":     ["business","puzzles"],
    "psychology":          ["people","lab"],
    "physics":             ["puzzles","lab","building"],
    "journalism":          ["writing","society","art"],
    "bangla":              ["writing","society"],
    "civil-engineering":   ["building","puzzles"],
    "mathematics":         ["puzzles"],
  };
  const matched = (interestMap[s.slug] || []).filter(k => inputs.interests.has(k));
  score += matched.length * 12;

  // A3 Math
  if (s.math) {
    if (inputs.math === "love") score += 18;
    else if (inputs.math === "ok") score += 6;
    else score -= 18;
  } else {
    if (inputs.math === "avoid") score += 8;
  }

  // A2 Driver
  const driverBoost = {
    "logic":     ["cse","mathematics","physics","economics","finance-banking","civil-engineering"],
    "aesthetic": ["uiux","english-lit","journalism"],
    "impact":    ["psychology","development-studies","agriculture","bangla"],
    "payoff":    ["cse","bba","finance-banking"],
    "curiosity": ["physics","mathematics","english-lit","geography","development-studies"],
  };
  if (driverBoost[inputs.driver] && driverBoost[inputs.driver].includes(s.slug)) score += 10;

  // A4 Memorization
  if (inputs.memorization === "reason" && ["bangla","english-lit","psychology"].includes(s.slug)) score -= 8;

  // A5 Problem style
  if (inputs.problemStyle === "closed" && ["cse","civil-engineering","mathematics","finance-banking"].includes(s.slug)) score += 6;
  if (inputs.problemStyle === "open" && ["development-studies","journalism","uiux","english-lit","psychology"].includes(s.slug)) score += 6;

  // A6 Work env
  const envBoost = {
    "desk":   ["cse","uiux","journalism","english-lit","finance-banking","mathematics"],
    "lab":    ["physics","agriculture","geography","psychology"],
    "people": ["bba","psychology","development-studies","english-lit","bangla"],
    "site":   ["civil-engineering","agriculture","geography"],
  };
  if (envBoost[inputs.workEnv] && envBoost[inputs.workEnv].includes(s.slug)) score += 8;

  // B1 HSC — hard filter
  const groupMap = { science: "Science", commerce: "Commerce", arts: "Arts", any: null };
  const group = groupMap[inputs.hsc];
  let eligibility = "full";
  if (group && !s.hsc.includes(group)) { eligibility = "alternative"; score -= 30; }
  else if (s.math && inputs.math === "avoid") { eligibility = "note"; }

  // B5 Abroad
  if (inputs.abroad === "yes") {
    if (["cse","physics","mathematics","economics","finance-banking","development-studies"].includes(s.slug)) score += 8;
  }
  // B6 Risk
  if (inputs.risk === "stable") {
    if (["bba","civil-engineering","bangla","agriculture"].includes(s.slug)) score += 6;
  } else if (inputs.risk === "upside") {
    if (["cse","uiux","finance-banking"].includes(s.slug)) score += 6;
  }

  // Confidence-tier guard — Listed-only subjects never rank top (Build Plan §4.1)
  if (s.confidence === "listed") score -= 6;

  score = Math.max(30, Math.min(95, score));
  return { score, eligibility };
}

function Results({ inputs, go, onRetry }) {
  const scored = PFData.subjects
    .map(s => ({ ...scoreSubject(s, inputs), subject: s }))
    .sort((a, b) => b.score - a.score);
  // Build Plan §4.1: a "Listed only" subject may never be ranked #1
  // → If the #1 is "listed", swap in the highest non-listed candidate
  if (scored[0] && scored[0].subject.confidence === "listed") {
    const idx = scored.findIndex(r => r.subject.confidence !== "listed");
    if (idx > 0) { const swap = scored[0]; scored[0] = scored[idx]; scored[idx] = swap; }
  }
  const top = scored.slice(0, 3);
  const ranks = ["🥇 Best match", "🥈 Strong match", "🥉 Worth investigating"];

  return (
    <div className="pf-matcher">
      <div style={{maxWidth: "var(--container-product)", margin: "0 auto", padding: "0 24px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
          <button className="pf-link" onClick={onRetry}>← Start over</button>
          <span className="micro" style={{margin:0}}>14 answers · 3 paths surfaced</span>
        </div>
        <SectionHead
          eyebrow="Your matched paths"
          title="Here's what fits."
          sub="Ranked by fit. Honest about limitations. The matcher only ranks subjects we have evidence for — thinly-evidenced subjects appear as 'worth investigating' but never as a top recommendation."

                  </div>

                {r.eligibility === "alternative" && (
                  <HonestyBox label="Alternative path">
                    <strong>Direct entry restricted</strong> for your HSC group. If this interests you, consider <strong>{(PFData.subjects.find(x => x.slug === s.alts[0]) || {}).name}</strong> — similar work, open to all HSC groups.
                  </HonestyBox>
                )}
                <div style={{display:"flex",gap:10,marginTop:16}}>
                  <button className="btn btn-primary" onClick={() => go("detail", { subjectSlug: s.slug })}>Explore full subject profile →</button>
                  <button className="btn btn-ghost">Share this result</button>
                </div>
              </div>
            );
          })}
        </div>
        {inputs.pushed ? (
          <div style={{background:"var(--surface-alt)",borderRadius:14,padding:"18px 22px",marginTop:24,fontSize:14,lineHeight:1.5,color:"var(--text)"}}>
            <div className="micro" style={{marginBottom:6}}>About the subject pushed on you</div>
            You mentioned <strong>{inputs.pushed}</strong>. We aren't dismissing it — but alongside that path, the three above are the closest fits to how you described yourself.

        ) : null}
        <div style={{background:"var(--gold-16)",borderRadius:14,padding:"20px 22px",marginTop:24,fontSize:15,lineHeight:1.5}}>
          <strong>This is one input — not a verdict.</strong> Talk to people already in these fields. Show this to your parents. Speak to a teacher. We're a starting point, not a finish line.
        </div>
        <div style={{height:64}}/>
      </div>
      <Footer go={go}/>
    </div>
  );
}

Object.assign(window, { ScreenMatcher });

})();
</script>
